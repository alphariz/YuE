[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yue2-infer"
version = "0.1.6"
description = "YuE2 music generation with editable symbolic plans"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "MODEL_LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "safetensors>=0.4.0",
    "tiktoken>=0.5.0",
    "numpy>=1.24.0,<3.0.0",
    "soundfile>=0.12.0",
    "accelerate>=0.28.0",
]

[project.optional-dependencies]
fast = ["vllm==0.19.0", "triton==3.6.0"]
test = ["pytest==9.0.3"]

[project.urls]
Repository = "https://github.com/multimodal-art-projection/YuE"
Demo = "https://map-yue2.github.io/"
Models = "https://huggingface.co/m-a-p/YuE2-3B"

[project.scripts]
yue2 = "yue2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
